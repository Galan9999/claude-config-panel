<title>Claude Config Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the local panel's sidebar + main, collapsing to a top tab strip on phones.
   Palette and type are the panel's own (ui/style.css), extended to both themes. */
:root{
  --bg:#F0EEE6; --panel:#FFFFFF; --panel2:#F7F5EF; --line:#E0DCD1; --line2:#CFC9BA;
  --tx:#1F1E1D; --dim:#6B6862; --acc:#D97757; --acc2:#B4532F; --accsoft:#FBEDE7;
  --ok:#4F7D45; --warn:#9A6A16; --err:#B23A26; --okbg:#E9F1E6; --warnbg:#F8EEDB; --errbg:#F8E3DE;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1E1D; --panel:#262624; --panel2:#2E2D2A; --line:#393734; --line2:#4A4844;
  --tx:#F0EEE6; --dim:#A09A90; --acc:#E08A6C; --acc2:#EBA287; --accsoft:#3A2A24;
  --ok:#8FBF84; --warn:#D9A84E; --err:#E0705C; --okbg:#243022; --warnbg:#33291A; --errbg:#3A2420;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1F1E1D; --panel:#262624; --panel2:#2E2D2A; --line:#393734; --line2:#4A4844;
  --tx:#F0EEE6; --dim:#A09A90; --acc:#E08A6C; --acc2:#EBA287; --accsoft:#3A2A24;
  --ok:#8FBF84; --warn:#D9A84E; --err:#E0705C; --okbg:#243022; --warnbg:#33291A; --errbg:#3A2420;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100%}
aside{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
  padding-block:18px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:12px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
main{flex:1;min-width:0;padding-block:28px 80px;padding-left:max(16px, 34px);padding-right:max(16px, env(safe-area-inset-right, 0px), 34px)}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 6px;font-weight:600;font-size:15px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--acc);flex:0 0 13px}
.who{padding:0 8px 16px;color:var(--dim);font-size:12.5px;line-height:1.4}
.nav{all:unset;box-sizing:border-box;width:100%;padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13.5px;margin-bottom:1px}
.nav:hover{background:var(--panel2)}
.nav:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.nav.on{background:var(--accsoft);color:var(--acc2);font-weight:560}
.nav .ic{width:17px;text-align:center;opacity:.75;font-size:13px}
.nav .n{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.navsep{height:1px;background:var(--line);margin:10px 6px}
h1{font-size:23px;margin:0 0 6px;letter-spacing:-.2px;text-wrap:balance}
h2.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:30px 0 11px;font-weight:600}
h3{font-size:15px;margin:0}
.lede{color:var(--dim);margin:0 0 22px;max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat span{color:var(--dim);font-size:12.5px}
.ttl{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.desc{color:var(--dim);font-size:13.5px;margin-top:4px;max-width:86ch;overflow-wrap:anywhere}
.langs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.langs .chip{padding:2px 8px;font-size:12px}
.tag{font:11px/1.6 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--dim);white-space:nowrap}
.tag.acc{background:var(--accsoft);border-color:var(--acc);color:var(--acc2)}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.tag.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.tag.err{background:var(--errbg);border-color:transparent;color:var(--err)}
code,.mono{font-family:var(--mono);font-size:12.5px}
code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
pre{font:12px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;max-height:440px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
:root[data-theme="dark"] .btn.pri{color:#1F1E1D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#1F1E1D}}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],select,textarea{font:inherit;font-size:13.5px;background:var(--panel);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;max-width:100%}
textarea{font-family:var(--mono);font-size:12.5px;width:100%;min-height:92px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:600;background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
details.piece{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.piece>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:flex-start}
details.piece>summary::-webkit-details-marker{display:none}
details.piece[open]>summary{border-bottom:1px solid var(--line)}
details.piece .body{padding:12px 14px}
.sum-main{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.rule{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rule:first-child{border-top:0}
.rule .r{flex:0 1 auto;min-width:0}
.rule .x{flex:1 1 280px;color:var(--dim);font-size:13px;min-width:0}
details.adv{margin-top:4px;font-size:13px}
details.adv summary{cursor:pointer;color:var(--acc2);font-size:12.5px}
.advbody{padding:8px 0 2px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.advbody p{margin:0}
.warn-text{color:var(--warn)}
.swap{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.chip.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc2)}
.chip:focus-visible{outline:2px solid var(--acc)}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:26px 20px;text-align:center;background:var(--panel);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--acc);background:var(--accsoft)}
.drop h3{font-size:16px;margin-bottom:4px}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.step .k{font:600 11px var(--mono);color:var(--acc2);letter-spacing:.6px;text-transform:uppercase}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr 3.5em;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.hbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--acc)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.sev{border-left:3px solid var(--line2);padding-left:12px}
.sev.high{border-color:var(--err)} .sev.medium{border-color:var(--warn)} .sev.low{border-color:var(--line2)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warnbg);color:var(--tx);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.banner.ok{background:var(--okbg)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.spark{display:block;width:100%;height:64px}
.toast{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--errbg);padding:8px 12px;border-radius:8px}
@media (max-width:760px){
  .shell{flex-direction:column}
  aside{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);
    padding-block:10px 8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:4px;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--panel)}
  .brand,.who,.navsep{display:none}
  .nav{width:auto;white-space:nowrap;flex:none}
  .nav .n{display:none}
  main{padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.src-modes{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:10px}
.src-modes .card{display:block;cursor:pointer}
.src-modes .card.on{border-color:var(--acc);background:var(--accsoft)}
.src-prompt{white-space:pre-wrap;font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:10px 0 0}
.src-in{margin-top:4px}.src-in summary{cursor:pointer;color:var(--acc2)}
</style>

<div class="shell">
  <aside>
    <div class="brand"><span class="dot"></span>Claude Config Panel</div>
    <div class="who" id="who">Your Claude Code setup, read in your browser.</div>
    <nav id="nav" aria-label="Views"></nav>
  </aside>
  <main id="main">
    <h1>Claude Config Panel</h1>
    <p class="lede">Loading…</p>
  </main>
</div>
<script type="module" src="app.js"></script>
